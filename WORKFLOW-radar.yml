name: House Music Radar

on:
  schedule:
    - cron: "0 13 * * *"   # 5am Pacific (6am in summer): fresh "Tonight" before you wake up
    - cron: "0 1 * * *"    # 5pm Pacific (6pm in summer): catches daytime announcements before you go out
  workflow_dispatch:       # the "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore artist memory and photos
        uses: actions/cache@v4
        with:
          path: |
            data/artist_memory.json
            data/photos
          key: radar-memory-${{ github.run_id }}
          restore-keys: radar-memory-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the radar
        run: python main.py
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          EDMTRAIN_CLIENT_KEY: ${{ secrets.EDMTRAIN_CLIENT_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SONGKICK_API_KEY: ${{ secrets.SONGKICK_API_KEY }}
          WATCH_LIST: ${{ secrets.WATCH_LIST }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          RADAR_WORKFLOW: "2026.11.06"   # lets the page tell you if GitHub is running an older copy of this file
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
